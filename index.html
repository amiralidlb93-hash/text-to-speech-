<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متن به گفتار</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f5f0;--card:#fff;--text:#1d1d1b;--muted:#6b6a64;--accent:#0f6e56;--accent-text:#fff;--border:#d8d5ca}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--text:#efede6;--muted:#a09e95;--accent:#3ecf9f;--accent-text:#0c1a15;--border:#3a3a36}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--text:#efede6;--muted:#a09e95;--accent:#3ecf9f;--accent-text:#0c1a15;--border:#3a3a36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:8px 0 14px}
textarea,select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
textarea{width:100%;min-height:160px;resize:vertical;font-size:1.05rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.row label{color:var(--muted);font-size:.9rem;display:flex;gap:6px;align-items:center}
select{max-width:100%}
button{cursor:pointer}
button.play{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.note{color:var(--muted);font-size:.85rem;min-height:1.3em}
</style>
</head>
<body>
<main>
<h1>🔊 متن به گفتار</h1>
<textarea id="t" placeholder="متنت رو اینجا بنویس..."></textarea>
<div class="row">
<label>زبان:
<select id="lang">
<option value="fa-IR">فارسی</option>
<option value="en-US">English</option>
<option value="az-AZ">Azərbaycan dili</option>
<option value="tr-TR">Türkçe</option>
<option value="ru-RU">Русский</option>
<option value="ar-SA">العربية</option>
<option value="fr-FR">Français</option>
<option value="es-ES">Español</option>
<option value="de-DE">Deutsch</option>
<option value="it-IT">Italiano</option>
<option value="zh-CN">中文</option>
<option value="ja-JP">日本語</option>
<option value="ko-KR">한국어</option>
<option value="hi-IN">हिन्दी</option>
</select></label>
<label>سرعت: <input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="0.9"></label>
</div>
<div class="row">
<button class="play" id="go">▶ بخون</button>
<button id="pause">⏸ مکث</button>
<button id="stop">⏹ توقف</button>
</div>
<p class="note" id="msg"></p>
</main>
<script>
const synth=window.speechSynthesis,$=id=>document.getElementById(id),msg=$('msg'),t=$('t');
function setDir(){t.dir=/[\u0600-\u06FF]/.test(t.value)?'rtl':'ltr'}
t.addEventListener('input',setDir);
function pick(lang){
 const v=synth.getVoices(),p=lang.split('-')[0];
 return v.find(x=>x.lang.replace('_','-')===lang)||v.find(x=>x.lang.toLowerCase().startsWith(p));
}
$('go').onclick=()=>{
 if(!synth){msg.textContent='مرورگرت از این قابلیت پشتیبانی نمی‌کنه.';return}
 const text=t.value.trim();if(!text){msg.textContent='اول یه متن بنویس.';return}
 synth.cancel();
 const l=$('lang').value,u=new SpeechSynthesisUtterance(text),v=pick(l);
 u.lang=l;if(v)u.voice=v;u.rate=parseFloat($('rate').value);
 msg.textContent=v?'':'برای این زبان صدایی روی دستگاهت پیدا نشد؛ ممکنه با صدای پیش‌فرض بخونه.';
 synth.speak(u);
};
$('pause').onclick=()=>{if(!synth)return;synth.paused?synth.resume():synth.pause()};
$('stop').onclick=()=>synth&&synth.cancel();
</script>
</body>
</html>
